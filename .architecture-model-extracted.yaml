meta:
  schema_version: '1.3'
  project: opencode-arch
  generated_at: ''
entities:
  components:
  - id: COMP-1
    name: Tools
    status: ACTIVE
    source_block: S1
    files:
    - src/opencode_arch/mcp/tools/author.py
    - src/opencode_arch/mcp/tools/check.py
    - src/opencode_arch/mcp/tools/correct.py
    - src/opencode_arch/mcp/tools/decompose.py
    - src/opencode_arch/mcp/tools/docs.py
    - src/opencode_arch/mcp/tools/export.py
    - src/opencode_arch/mcp/tools/extract.py
    - src/opencode_arch/mcp/tools/feedback.py
    - src/opencode_arch/mcp/tools/gate.py
    - src/opencode_arch/mcp/tools/generate.py
    - src/opencode_arch/mcp/tools/group.py
    - src/opencode_arch/mcp/tools/ingest.py
    - src/opencode_arch/mcp/tools/llm_audit.py
    - src/opencode_arch/mcp/tools/regen_score.py
    - src/opencode_arch/mcp/tools/require.py
    - src/opencode_arch/mcp/tools/scan.py
    - src/opencode_arch/mcp/tools/slice.py
    - src/opencode_arch/mcp/tools/stats.py
    - src/opencode_arch/mcp/tools/trace_requirements.py
    - src/opencode_arch/mcp/tools/validate.py
    contract: architect_author MCP tool — forward-author architecture from requirements
    constants:
    - name: COMPRESSION_WARN_THRESHOLD
      value: '50'
      context: architect_slice MCP tool — compress repository context for LLM consumption
    - name: COMPRESSION_CRITICAL_THRESHOLD
      value: '200'
      context: architect_slice MCP tool — compress repository context for LLM consumption
    signatures:
    - name: author_architecture
      params:
      - 'repo_path: str'
      - 'requirements_text: str'
      returns: dict[str, Any]
      body_hint: "Parse requirements text and produce a concept-phase architecture model.\n\nArgs:\n    repo_path: Absolute\
        \ path to the repository root.\n    requirements_text: Free-form or structured requirements document text.\n\nReturns:\n\
        \    Dict with model_path, entity counts, and lifecycle_phase."
    - name: check_representativeness
      params:
      - 'repo_path: str'
      - 'model_yaml: str'
      returns: dict[str, Any]
      body_hint: "Check how well an architecture model represents the actual codebase.\n\nSupports three modes:\n- Hierarchical\
        \ (config): uses pre-existing source_block_dict from config\n- Hierarchical (auto): generates F-blocks from module\
        \ grouping when no config exists\n- Flat: fallback when neither hierarchical path is available\n\nArgs:\n    repo_path:\
        \ Absolute path to the repository root.\n    model_yaml: The architecture model YAML to evaluate.\n\nReturns:\n  \
        \  Dict with scores, details, and suggested improvements."
    - name: store_correction
      params:
      - 'repo_path: str'
      - 'correction_type: str'
      - 'target: str'
      - 'reason: str'
      - 'suggestion: dict | None'
      returns: dict[str, Any]
      body_hint: "Store a structured correction for the architecture model.\n\nCorrections are consumed on next pipeline run\
        \ to improve the model.\n\nArgs:\n    repo_path: Absolute path to the repository.\n    correction_type: One of: split_component,\
        \ merge_components, add_component,\n        remove_component, add_relationship, remove_relationship, rename, reclassify.\n\
        \    target: Entity ID being corrected (e.g., \"COMP-3\").\n    reason: Why this correction is needed.\n    suggestion:\
        \ Optional structured suggestion (format depends on type)."
    - name: decompose_repository
      params:
      - 'repo_path: str'
      returns: dict[str, Any]
      body_hint: "Decompose architecture model into per-block sub-models and recursive manifests.\n\nReads .architecture-model.yaml,\
        \ traces relationships per F-block,\nwrites sub-models to .architecture-models/ and per-block manifests\nto .architecture/manifests/.\n\
        \nArgs:\n    repo_path: Absolute path to the repository.\n\nReturns:\n    Dict with sub_models, recursive_manifests,\
        \ and paths."
    - name: generate_docs
      params:
      - 'repo_path: str'
      - 'formats: str'
      - 'manifest: Any'
      returns: dict[str, Any]
      body_hint: "Generate standard SE documentation from an architecture model.\n\nProduces component specs, ICDs, dependency\
        \ matrix, health report,\nand index from .architecture-model.yaml.\n\nArgs:\n    repo_path: Absolute path to the repository.\n\
        \    formats: Comma-separated list of doc types to generate.\n        Options: all, component_spec, icd, dependency_matrix,\
        \ health, drift, index.\n        Default: \"all\".\n\nReturns:\n    Dict with generated file paths and any errors."
    - name: export_repository
      params:
      - 'repo_path: str'
      - 'output_dir: str'
      - 'output_format: str'
      - 'prefix: str'
      returns: dict[str, Any]
      body_hint: "Export repository architecture as flat files for mobile AI.\n\nBuilds a set of flat files (model, sub-models,\
        \ docs, manifests, specs,\ndiagrams, skills, reference docs) suitable for use in token-limited\nAI environments.\n\
        \nArgs:\n    repo_path: Absolute path to the repository.\n    output_dir: Where to write output. Default: {repo_path}/.architecture-export/\n\
        \    output_format: \"dir\" (flat directory) or \"zip\" (single zip file).\n    prefix: File prefix override. Default:\
        \ auto-derived from repo name.\n\nReturns:\n    Dict with file list, sizes, and output location."
    - name: store_extraction
      params:
      - 'repo_path: str'
      - 'model_yaml: str'
      - 'context_tokens: int'
      returns: dict[str, Any]
      body_hint: "Validate and store an architecture model extraction.\n\nCalled AFTER the agent has produced a YAML architecture\
        \ model.\nValidates the model, writes it to .architecture-model.yaml,\nand records telemetry.\n\nArgs:\n    repo_path:\
        \ Path to the repository root (where to save the model).\n    model_yaml: The YAML architecture model produced by\
        \ the agent.\n    context_tokens: How many tokens of context the agent used (for telemetry).\n\nReturns:\n    Dict\
        \ with: stored (bool), score (int), issues (list), telemetry_recorded (bool),\n    pipeline (dict), warnings (list)."
    - name: record_feedback
      params:
      - 'repo_path: str'
      - 'feedback_type: str'
      - 'content: str'
      - 'context: dict | None'
      - 'rating: int | None'
      - 'correction: dict | None'
      returns: dict[str, Any]
      body_hint: "Record user feedback to .architecture/feedback.jsonl.\n\nArgs:\n    repo_path: Repository root path\n  \
        \  feedback_type: \"correction\" | \"rating\" | \"tool_feedback\" | \"training\"\n    content: The feedback content\
        \ (human-readable)\n    context: Optional context dict (tool name, prompt, response, etc.)\n    rating: Optional 1-5\
        \ quality rating\n    correction: Optional structured correction {entity_id, field, old, new}\n\nReturns:\n    {recorded,\
        \ feedback_id, total_feedback}"
    - name: check_gate
      params:
      - 'repo_path: str'
      - 'model_yaml: str'
      returns: dict[str, Any]
      body_hint: "Check development gate for an architecture model against code reality.\n\nArgs:\n    repo_path: Absolute\
        \ path to the repository root.\n    model_yaml: Optional YAML string. If empty, reads .architecture-model.yaml.\n\n\
        Returns:\n    Dict with lifecycle_phase, sub-scores, phase_requirements_met, and issues."
    - name: run_tests_on_generated_code
      params:
      - 'repo_path: str'
      - 'test_command: str | None'
      returns: dict[str, Any]
      body_hint: "Run the repository's test suite against generated code.\n\nThis is the quality gate for code generation.\
        \ The agent generates code,\nthen calls this tool to verify it passes the original tests.\n\nArgs:\n    repo_path:\
        \ Path to the repository with generated code + tests.\n    test_command: Custom test command. Defaults to pytest.\n\
        \nReturns:\n    Dict with: passed (bool), pass_rate (float), total_tests (int),\n    passed_tests (int), failures\
        \ (list of failure descriptions)."
    - name: group_repository
      params:
      - 'repo_path: str'
      - 'target_groups: int'
      returns: dict[str, Any]
      body_hint: "Group repository modules into logical architecture components.\n\nUses multi-signal affinity (subdirectory,\
        \ name-prefix, imports) to\ncluster source files into coherent component groups. This provides\nsuggested component\
        \ boundaries for architecture extraction.\n\nArgs:\n    repo_path: Absolute path to the repository root.\n    target_groups:\
        \ Desired number of groups. 0 = auto-calculate.\n\nReturns:\n    Dict with keys: groups, total_modules, total_groups,\
        \ filtered_trivial.\n    Each group has: name, files, file_count, locked.\n    Returns {\"error\": \"...\"} on failure."
    - name: ingest_source_graph
      params:
      - 'repo_path: str'
      - 'source_graph_json: str'
      returns: dict
      body_hint: "Ingest a SourceGraph JSON and generate architecture components.\n\nArgs:\n    repo_path: Absolute path to\
        \ the repository.\n    source_graph_json: JSON string with SourceGraph data.\n\nReturns:\n    Dict with components,\
        \ interfaces, and group info."
    - name: run_llm_audit
      params:
      - 'repo_path: str'
      - 'model_yaml: str'
      - _runner
      - '_cache: LLMCache | None'
      returns: dict[str, Any]
      body_hint: Run two-stage LLM functional-decomposition audit.
    - name: regen_score
      params:
      - 'repo_path: str'
      - 'component_id: str'
      returns: dict
      body_hint: 'Compute regen readiness score for a repository or specific component.


        Returns overall score, grade, per-component breakdown, and blockers.'
    - name: spot_check
      params:
      - 'repo_path: str'
      - 'component_id: str'
      - 'subsystem_id: str'
      returns: dict
      body_hint: 'Run a spot-check regeneration probe on a component or subsystem.


        Regenerates code via LLM, compares against source, reports diagnostics.

        On failure, classifies patterns and suggests healing actions.'
    - name: capture_requirement
      params:
      - 'repo_path: str'
      - 'requirement: str'
      - 'component_id: str | None'
      - 'priority: str'
      - 'context: str'
      returns: dict[str, Any]
      body_hint: "Store a functional requirement linked to a component.\n\nArgs:\n    repo_path: Repository root path\n  \
        \  requirement: The requirement text\n    component_id: Component ID (e.g., \"COMP-3\"). If None, stored as unlinked.\n\
        \    priority: must | should | could (MoSCoW)\n    context: Additional context from conversation\n\nReturns:\n   \
        \ {stored, requirement_id, component, total_requirements}"
    - name: scan_repository
      params:
      - 'repo_path: str'
      returns: dict[str, Any]
      body_hint: "Scan a repository and generate its reality manifest.\n\nPerforms AST analysis on all source files to produce\
        \ a ground-truth\ninventory of modules, functions, classes, imports, and metrics.\n\nArgs:\n    repo_path: Absolute\
        \ path to the repository root.\n\nReturns:\n    Manifest dict with keys: generated_at, project_root, metrics,\n  \
        \  functional_blocks, modules, interfaces.\n    Returns {\"error\": \"...\"} on failure."
    - name: compute_adaptive_budget
      params:
      - 'module_count: int'
      - 'base: int'
      returns: int
      body_hint: "Scale token budget with repository size.\n\nSmall repos (<=20 modules): base budget (4000 tokens)\nMedium\
        \ repos: +200 tokens per 10 modules over 20\nLarge repos: capped at 16000 tokens\n\nExamples:\n    20 modules → 4000\
        \ tokens\n    50 modules → 4600 tokens  \n    100 modules → 5600 tokens\n    161 modules → 6800 tokens\n    500 modules\
        \ → 16000 tokens (capped)"
    - name: slice_context
      params:
      - 'repo_path: str'
      - 'focus: str'
      - 'budget: int'
      - 'detail: str'
      returns: str
      body_hint: "Generate an optimized context slice from a repository.\n\nThis is the core token-arbitrage function. It\
        \ compresses a full repository\ninto a dense, structured context string within the token budget.\n\nIf an .architecture-model.yaml\
        \ exists, uses the model + slicer + formatter.\nOtherwise, falls back to manifest-based context.\n\nArgs:\n    repo_path:\
        \ Absolute path to the repository root.\n    focus: Focus scope - \"all\", an source-block ID (e.g. \"F1\"), a layer\
        \ name,\n           or an artifact name (e.g. \"icd\", \"requirements-analysis\").\n    budget: Maximum token budget\
        \ (1 token ~ 4 chars).\n    detail: Detail level - \"minimal\", \"standard\", or \"full\".\n\nReturns:\n    Formatted\
        \ context string within budget, or error message."
    - name: get_stats
      params:
      - 'repo_path: str'
      - 'tool_filter: str'
      returns: dict[str, Any]
      body_hint: "Aggregate quality and performance metrics.\n\nReturns session stats, historical telemetry summary, and actionable\
        \ suggestions.\n\nArgs:\n    repo_path: Optional - filter stats to specific repo.\n    tool_filter: Optional - filter\
        \ to specific tool name."
    - name: trace_requirements
      params:
      - 'repo_path: str'
      - 'model_yaml: str'
      - 'requirements_doc: str'
      - _runner
      - _cache
      returns: dict
      body_hint: 'Trace requirements to functions.


        If requirements_doc provided: parse structurally, fall back to LLM for freeform.

        If no requirements_doc: use retroactive derivation from model.

        Then match functions to requirements.

        Output: .architecture-models/requirements-trace.json'
    - name: validate_architecture
      params:
      - 'model_yaml: str'
      returns: dict[str, Any]
      body_hint: "Validate an architecture model for structural correctness.\n\nArgs:\n    model_yaml: The YAML architecture\
        \ model string to validate.\n\nReturns:\n    Dict with: score (0-100), issues (list), entity_count, relationship_count,\
        \ is_valid."
    interfaces:
    - name: exposes_to_Cli
      kind: provides
      target_component: COMP-3
      symbols:
      - store_extraction
    - name: uses_Resolution
      kind: requires
      target_component: COMP-5
      symbols:
      - estimate_regenerability
      - check_fidelity
      - with_quality
      - SessionAccumulator
    - name: uses_Cli
      kind: requires
      target_component: COMP-3
      symbols:
      - drain_and_store
    - name: uses_Requirements
      kind: requires
      target_component: COMP-4
      symbols:
      - hash_content
      - cached_llm_call
      - CachedResult
      - LLMCache
  - id: COMP-2
    name: Artifacts
    status: ACTIVE
    source_block: S1
    files:
    - src/opencode_arch/artifacts/context.py
    - src/opencode_arch/artifacts/diagrams.py
    - src/opencode_arch/artifacts/selector.py
    - src/opencode_arch/artifacts/templates.py
    contract: Context assembler for artifact generation
    symbols:
    - name: ArtifactSpec
      kind: dataclass
    - name: SubsystemInfo
      kind: dataclass
    - name: TemplateSection
      kind: dataclass
    - name: ArtifactTemplate
      kind: dataclass
    signatures:
    - name: assemble_artifact_context
      params:
      - 'template: ArtifactTemplate'
      - 'model: ArchitectureModel'
      - 'manifest: dict | None'
      - 'max_tokens: int'
      returns: str
      body_hint: 'Assemble formatted context for artifact generation.


        Returns a structured prompt string containing:

        1. System prompt from template

        2. For each section: heading + extracted data + instructions


        Token budget is approximate (1 token ~ 4 chars). If total exceeds budget,

        truncate section data (not instructions).'
    - name: format_capability_detail_context
      params:
      - 'cap_id: str'
      - 'model: ArchitectureModel'
      - 'manifest: dict | None'
      returns: str
      body_hint: 'Assemble rich context for generating a per-capability API detail doc.


        Extracts the full neighborhood of a single capability:

        - The capability entity itself

        - Realizing component(s) and their files/signatures/constants

        - Related behaviors (steps, triggers, pre/postconditions)

        - Exposed interfaces (endpoints, protocol)

        - Applicable constraints

        - Upstream/downstream relationships


        Returns a structured text block suitable for LLM prompt injection.'
    - name: generate_component_diagram
      params:
      - 'model: ArchitectureModel'
      returns: str
      body_hint: 'Generate a C4-style component diagram showing system structure.


        Groups components by layer, renders actors, and shows

        depends-on/exposes/consumes relationships.'
    - name: generate_dependency_diagram
      params:
      - 'model: ArchitectureModel'
      returns: str
      body_hint: 'Generate a dependency graph showing component relationships.


        Simpler than C4 — plain PlantUML with rectangles and arrows.

        Only includes entities that participate in at least one relationship.'
    - name: generate_sequence_diagram
      params:
      - 'behavior: Behavior'
      - 'model: ArchitectureModel'
      returns: str
      body_hint: 'Generate a sequence diagram from a behavior''s steps.


        Returns empty string if behavior has no steps.'
    - name: generate_nav_diagram
      params:
      - 'model: ArchitectureModel'
      returns: str
      body_hint: 'Generate a full-model navigational traceability diagram.


        Shows ALL entities (typed shapes) and ALL relationships (labeled edges)

        on a single page. Components are nested inside their layer packages.

        Every node displays its ID for precise referencing by systems engineers.'
    - name: generate_focused_diagram
      params:
      - 'model: ArchitectureModel'
      - 'entity_id: str'
      - 'depth: int'
      returns: str
      body_hint: 'Generate a focused subgraph centered on a specific entity.


        Performs BFS from entity_id through relationships (both directions)

        up to `depth` hops. Renders only the reachable subgraph with the

        focus entity highlighted.


        Returns empty string if entity_id is not found in the model.'
    - name: generate_all_diagrams
      params:
      - 'model: ArchitectureModel'
      returns: dict[str, str]
      body_hint: 'Generate all applicable diagrams for the model.


        Returns dict mapping diagram name to PlantUML string.

        Only includes diagrams where there''s enough data.'
    - name: select_artifacts
      params:
      - 'model: ArchitectureModel'
      - 'manifest: dict | None'
      - 'include_capability_details: bool'
      returns: list[ArtifactSpec]
      body_hint: 'Return artifacts appropriate for this model''s richness.


        For each artifact in the registry, check if the model has the required entities.

        Return only those artifacts whose requirements are met.

        Results sorted by priority (1 first), then alphabetically by id.


        If include_capability_details is True, also generates per-capability

        api-detail-{cap_id} artifacts for every realized capability.'
    - name: get_artifact_spec
      params:
      - 'artifact_id: str'
      returns: ArtifactSpec | None
      body_hint: Look up a single artifact spec by ID.
    - name: should_decompose
      params:
      - 'model: ArchitectureModel'
      - 'manifest: dict | None'
      returns: bool
      body_hint: 'Determine if system is complex enough to warrant per-subsystem docs.


        Heuristic: returns True if ANY of:

        - More than 5 functional blocks (distinct source_block values on components)

        - More than 50 source files in manifest

        - More than 20 components'
    - name: select_subsystem_artifacts
      params:
      - 'subsystem: SubsystemInfo'
      - 'model: ArchitectureModel'
      - 'manifest: dict | None'
      returns: list[ArtifactSpec]
      body_hint: 'Select artifacts appropriate for a subsystem (subset of system-level).


        Only returns artifacts from SUBSYSTEM_ARTIFACTS that:

        1. Are in the SUBSYSTEM_ARTIFACTS list

        2. Have their requirements met (scoped to subsystem''s components)


        Returns empty list if subsystem has no components.'
    - name: select_capability_detail_artifacts
      params:
      - 'model: ArchitectureModel'
      returns: list[ArtifactSpec]
      body_hint: 'Generate one ArtifactSpec per capability for detailed API docs.


        Only includes capabilities that have at least one realizing component

        (via ''realizes'' relationship). Each gets artifact_id = "api-detail-{cap.id}".'
    - name: get_template
      params:
      - 'artifact_id: str'
      returns: ArtifactTemplate | None
      body_hint: Look up template by artifact ID. Returns None if not found.
  - id: COMP-3
    name: Cli
    status: ACTIVE
    source_block: S1
    files:
    - src/opencode_arch/cli/bench.py
    - src/opencode_arch/cli/calibrate.py
    - src/opencode_arch/cli/confidence.py
    - src/opencode_arch/cli/docs.py
    - src/opencode_arch/cli/docs_validator.py
    - src/opencode_arch/cli/export_data.py
    - src/opencode_arch/cli/extract.py
    - src/opencode_arch/cli/gap_analyzer.py
    - src/opencode_arch/cli/generate.py
    - src/opencode_arch/cli/launch.py
    - src/opencode_arch/cli/main.py
    - src/opencode_arch/cli/metrics.py
    - src/opencode_arch/cli/regen_loop.py
    - src/opencode_arch/runner/base.py
    - src/opencode_arch/runner/opencode.py
    - src/opencode_arch/telemetry/collector.py
    - src/opencode_arch/telemetry/recorder.py
    - src/opencode_arch/telemetry/store.py
    - src/opencode_arch/learning/adapter.py
    - src/opencode_arch/learning/assessor.py
    - src/opencode_arch/learning/classifier.py
    - src/opencode_arch/learning/lessons.py
    - src/opencode_arch/learning/maintainer.py
    - src/opencode_arch/learning/patterns.py
    responsibilities:
    - is valid
    - run
    - run
    - record
    - query
    - averages
    - log regen outcome
    - get patterns
    - query regen outcomes
    - record learning curve
    - get learning curve
    - record report card
    - get report cards
    - record lesson
    - get lessons
    - mark lesson applied
    - record drift flag
    - get drift flags
    - resolve drift flag
    - record function metric
    - get function metrics
    contract: Bench command - benchmark extraction on multiple repos
    pattern: monitor
    symbols:
    - name: CalibrationReport
      kind: dataclass
    - name: DocsResult
      kind: dataclass
    - name: ValidationIssue
      kind: dataclass
    - name: DocsValidationResult
      kind: dataclass
      members:
      - is_valid
    - name: PromptMetrics
      kind: dataclass
    - name: RunResult
      kind: dataclass
    - name: RunnerBackend
      kind: protocol
      members:
      - run
      supers:
      - Protocol
    - name: OpencodeRunner
      kind: class
      members:
      - __init__
      - run
    - name: TelemetryStore
      kind: class
      members:
      - __init__
      - record
      - query
      - averages
      - log_regen_outcome
      - get_patterns
      - query_regen_outcomes
      - record_learning_curve
      - get_learning_curve
      - record_report_card
      - get_report_cards
      - record_lesson
      - get_lessons
      - mark_lesson_applied
      - record_drift_flag
      - get_drift_flags
      - resolve_drift_flag
      - record_function_metric
      - get_function_metrics
    - name: PromptAdaptation
      kind: dataclass
    - name: ReportCard
      kind: dataclass
    - name: Lesson
      kind: dataclass
    - name: DriftFlag
      kind: dataclass
    - name: PatternType
      kind: enum
      supers:
      - str
      - Enum
    - name: Strategy
      kind: enum
      supers:
      - str
      - Enum
    - name: FailureClassification
      kind: dataclass
    constants:
    - name: CONTEXT_START
      value: '''<!-- opencode-arch:start -->'''
      context: Interactive launch — architecture
    - name: CONTEXT_END
      value: '''<!-- opencode-arch:end -->'''
      context: Interactive launch — architecture
    signatures:
    - name: run_bench
      params:
      - 'repos: list[str]'
      - 'runner: RunnerBackend'
      - 'budget: int'
      - 'target_score: int'
      returns: list[dict[str, Any]]
      body_hint: Run extraction benchmark on multiple repositories.
    - name: select_calibration_targets
      params:
      - model_or_components
      - 'n: int'
      - 'min_confidence: float'
      - 'count: int'
      body_hint: 'Select components for calibration.


        Supports two calling conventions:

        - Legacy: select_calibration_targets(model, n=3, min_confidence=0.7) with ArchitectureModel

        - New: select_calibration_targets(components, count=6) with list[dict]'
    - name: format_calibration_prompt
      params:
      - 'comp: Component'
      returns: str
      body_hint: Format a prompt asking the agent to regenerate a component from its model spec.
    - name: compare_regeneration
      params:
      - 'original: ''str | Path'''
      - 'generated: str'
      returns: dict
      body_hint: 'Compare original and generated source code by public API coverage.


        original can be a string of source code or a Path to a file.'
    - name: format_regeneration_prompt
      params:
      - 'component_context: dict'
      returns: str
      body_hint: Format a prompt for regenerating a component from model data only.
    - name: compute_correlation
      params:
      - 'data: list[dict]'
      returns: float
      body_hint: Pearson correlation between confidence and regen_quality fields.
    - name: run_confidence
      params:
      - 'repo_path: str'
      returns: str
      body_hint: Run confidence analysis and return formatted output.
    - name: run_docs_generate
      params:
      - 'repo_path: Path'
      - 'runner: RunnerBackend'
      - 'output_dir: Path | None'
      - 'artifact_filter: list[str] | None'
      - 'model_path: Path | None'
      returns: DocsResult
      body_hint: "Generate SE documentation for a project.\n\nFlow:\n1. Load model from project (or model_path override)\n\
        2. Generate manifest via generate_manifest()\n3. Call select_artifacts(model, manifest) to determine what to generate\n\
        4. If artifact_filter provided, intersect with selected artifacts\n5. For each artifact:\n   a. Get template from\
        \ TEMPLATES[artifact_id]\n   b. Assemble context via assemble_artifact_context(template, model, manifest)\n   c. Build\
        \ full prompt (context + generation instructions)\n   d. Call runner.run(prompt, str(repo_path))\n   e. Write result\
        \ to output_dir/filename\n6. Generate index.md linking all artifacts\n7. Return DocsResult"
    - name: run_docs_list
      params:
      - 'repo_path: Path'
      - 'model_path: Path | None'
      returns: list[dict[str, str]]
