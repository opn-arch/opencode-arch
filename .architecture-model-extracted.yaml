      - 'repo_path: Path'
      - 'component_id: str | None'
      - 'subsystem_id: str | None'
      returns: SpotCheckTarget
      body_hint: 'Select and prepare a spot-check target.


        If component_id specified, use that.

        If subsystem_id specified, load that subsystem''s model.

        If neither, pick the easiest (highest static score, smallest).'
    - name: run_spot_check
      params:
      - 'target: SpotCheckTarget'
      - 'repo_path: Path'
      - 'max_iterations: int'
      - 'llm_backend: Any'
      returns: SpotCheckResult
      body_hint: 'Run the spot-check: regen target via LLM, diff against source, iterate on failure.


        If llm_backend is None, returns a dry-run result showing what WOULD be checked.'
    - name: register_handler
      params:
      - 'method: str'
      - 'handler: Callable'
      returns: None
      body_hint: 'Register a resolution handler for a method type.


        Handler signature: (uncertainty: Uncertainty) -> Evidence | None'
    - name: resolve
      params:
      - 'uncertainty: Uncertainty'
      returns: ResolutionOutcome | None
      body_hint: 'Attempt to resolve an uncertainty.


        Returns ResolutionOutcome if resolved, None if unresolvable.'
    - name: resolve_all
      params:
      - 'uncertainties: list[Uncertainty]'
      returns: list[ResolutionOutcome]
      body_hint: Resolve a batch of uncertainties. Returns successful resolutions.
    - name: unresolvable_categories
      returns: set[str]
      body_hint: Categories that have no handler registered.
    - name: estimate_regenerability
      params:
      - 'compression_ratio: float'
      - 'confidence: float'
      - 'n_components: int'
      - 'n_contracts: int'
      returns: float
      body_hint: Estimate regenerability based on compression ratio, confidence, components, and contracts.
    - name: check_fidelity
      params:
      - 'input_data: Any'
      - 'output_data: Any'
      returns: dict
      body_hint: Count entities in input vs output and detect data loss.
    - name: with_quality
      params:
      - func
      body_hint: Decorator that appends _quality metadata to dict results.
    - name: record
      params:
      - 'tool_name: str'
      - 'latency_ms: float'
      - 'warnings: list'
    - name: summary
      returns: dict
    - name: format_model_context
      params:
      - 'model: ArchitectureModel'
      - 'max_tokens: int'
      - 'detail_level: str'
      returns: str
      body_hint: "Format the full model as compact LLM context.\n\nArgs:\n    model: Architecture model to format.\n    max_tokens:\
        \ Approximate token budget (1 token ~ 4 chars).\n    detail_level: \"minimal\", \"standard\", or \"full\".\n\nReturns:\n\
        \    Formatted text suitable for LLM system prompt injection."
    - name: format_source_block_context
      params:
      - 'model: ArchitectureModel'
      - 'source_block: str'
      - 'max_tokens: int'
      - 'project_root: ''Path | None'''
      returns: str
      body_hint: 'Format context for a single F-block (for artifact section regeneration).


        Produces: capability description, related UCs, components, interfaces.

        If *project_root* is given, sub-models are auto-loaded for richer detail,

        and per-block manifests are consumed for function-level context.'
    - name: format_artifact_context
      params:
      - 'model: ArchitectureModel'
      - 'artifact_name: str'
      - 'max_tokens: int'
      returns: str
      body_hint: 'Format context appropriate for regenerating a specific artifact.


        Uses artifact-specific slicing then formats at appropriate detail level.'
    - name: query_model
      params:
      - 'model: ArchitectureModel'
      - 'question: str'
      returns: str
      body_hint: 'Answer a structural question from model data.


        Supports questions like:

        - "What realizes F3?" → list behaviors with tag F3

        - "What does UC-14 depend on?" → follow depends-on relationships

        - "What interfaces does F4 expose?" → filter interfaces by provider'
    - name: impact_analysis
      params:
      - 'model: ArchitectureModel'
      - 'entity_id: str'
      - 'depth: int'
      returns: str
      body_hint: 'Determine what entities are affected if a given entity changes.


        Traces relationships transitively up to `depth` levels.'
    - name: get_model
      params:
      - 'project_root: str | Path'
      - 'force_refresh: bool'
      returns: ArchitectureModel
      body_hint: "Load or generate the architecture model for the project.\n\nIf the model YAML exists and isn't stale, loads\
        \ it.\nIf missing or force_refresh=True, re-extracts from artifacts and merges manifest.\n\nArgs:\n    project_root:\
        \ Path to project root directory.\n    force_refresh: Force re-extraction even if model exists.\n\nReturns:\n    Loaded\
        \ and validated ArchitectureModel."
    - name: get_artifact_context
      params:
      - 'project_root: str | Path'
      - 'artifact_name: str'
      - 'max_tokens: int'
      returns: str
      body_hint: "Get model-based context for artifact generation/regeneration.\n\nThis REPLACES the raw manifest slice with\
        \ structured architectural context.\nThe returned string is injected into the LLM system prompt alongside the\nmanifest\
        \ metrics (which are kept for ground-truth file counts).\n\nArgs:\n    project_root: Project root path.\n    artifact_name:\
        \ Which artifact needs context.\n    max_tokens: Token budget for the context block.\n\nReturns:\n    Formatted model\
        \ context string for LLM prompt injection."
    - name: get_source_block_context
      params:
      - 'project_root: str | Path'
      - 'source_block: str'
      - 'max_tokens: int'
      returns: str
      body_hint: "Get model-based context for a single F-block (for section regeneration).\n\nArgs:\n    project_root: Project\
        \ root path.\n    source_block: F-block ID (e.g., \"S3\").\n    max_tokens: Token budget.\n\nReturns:\n    Formatted\
        \ F-block context string."
    - name: get_model_summary
      params:
      - 'project_root: str | Path'
      returns: dict[str, Any]
      body_hint: 'Get a summary dict of the model for injection into pipeline metadata.


        Returns dict with entity_count, relationship_count, validation score, etc.'
    - name: enrich_manifest_slice
      params:
      - 'manifest_slice: str'
      - 'project_root: str | Path'
      - 'artifact_name: str'
      - 'max_model_tokens: int'
      returns: str
      body_hint: "Enrich an existing manifest slice with architecture model context.\n\nThis is the BACKWARD-COMPATIBLE integration\
        \ point. The existing pipeline\ngenerates manifest slices via _pipeline_manifest.py — this function\nprepends model\
        \ context to that slice, giving the LLM both:\n1. Architectural structure (from model) — WHAT things mean, how they\
        \ relate\n2. Code-grounded metrics (from manifest) — WHAT actually exists\n\nArgs:\n    manifest_slice: Raw manifest\
        \ slice text (from _pipeline_manifest.py).\n    project_root: Project root path.\n    artifact_name: Which artifact\
        \ this slice is for.\n    max_model_tokens: Token budget for model context portion.\n\nReturns:\n    Combined context:\
        \ model context + separator + manifest metrics."
