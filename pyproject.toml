[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-arch"
version = "0.3.0"
description = "OpenCode architecture extension - context compression and validation tools"
requires-python = ">=3.11"
dependencies = [
    "architecture-model-standard>=0.1.0",
    "pyyaml>=6.0",
]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
mcp = ["mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_arch"]

[project.scripts]
opencode-arch = "opencode_arch.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: expensive end-to-end tests requiring LLM calls (deselect with '-m \"not e2e\"')",
]
