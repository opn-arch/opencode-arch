[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-arch"
version = "1.1.0"
description = "Architecture-aware development tools — extract, validate, and maintain architectural models with token-efficient AI integration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Anomaly Contributors"}]
keywords = ["architecture", "mcp", "llm", "code-analysis", "token-compression", "ast", "opencode"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "architecture-model-standard>=1.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/opn-arch/opencode-arch"
Repository = "https://github.com/opn-arch/opencode-arch"
Documentation = "https://github.com/opn-arch/opencode-arch#readme"
"Bug Tracker" = "https://github.com/opn-arch/opencode-arch/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "respx>=0.21", "flask>=3.0"]
mcp = ["mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_arch"]

[project.scripts]
opencode-arch = "opencode_arch.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: expensive end-to-end tests requiring LLM calls (deselect with '-m \"not e2e\"')",
    "no_pkg_init: opt out of the lifecycle-test autouse fixture that pre-writes package.yaml",
]

[tool.coverage.run]
source = ["opencode_arch"]

[tool.coverage.report]
show_missing = true
skip_empty = true
