name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout architecture-model-standard (sibling)
        uses: actions/checkout@v4
        with:
          repository: opn-arch/architecture-model-standard
          ref: ${{ github.head_ref || github.ref_name }}
          path: architecture-model-standard-src
        continue-on-error: true
      - name: Fallback to main if branch not found
        run: |
          if [ ! -d architecture-model-standard-src ]; then
            git clone --depth=1 https://github.com/opn-arch/architecture-model-standard.git architecture-model-standard-src
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ./architecture-model-standard-src
      - run: pip install -e ".[dev,mcp]"
      - run: pytest tests/ -v --tb=short -m "not e2e" --ignore=tests/test_extract_from_code.py --ignore=tests/test_docs_cli.py
