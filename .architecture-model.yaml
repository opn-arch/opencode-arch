      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row;\
        \ if category:\n    rows = conn.execute('SELECT * FROM lessons WHERE category\
        \ = ? ORDER BY timestamp DESC', (category,)).fetchall()\nelse:\n    rows =\
        \ conn.execute('SELECT * FROM lessons ORDER BY timestamp DESC').fetchall();\
        \ conn.close(); return [dict(row) for row in rows]"
    - name: TelemetryStore.mark_lesson_applied
      params:
      - 'lesson_id: str'
      - 'repo: str'
      body_hint: "conn = sqlite3.connect(self.db_path); row = conn.execute('SELECT\
        \ applied_to FROM lessons WHERE lesson_id = ?', (lesson_id,)).fetchone();\
        \ if row:\n    import json\n    current = json.loads(row[0] or '[]')\n   \
        \ if repo not in current:\n        current.append(repo)\n        conn.execute('UPDATE\
        \ lessons SET applied_to = ? WHERE lesson_id = ?', (json.dumps(current), lesson_id))\n\
        \        conn.commit(); conn.close()"
