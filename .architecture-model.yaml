        0), features.get('contract_count', 0), pass_rate, time_seconds, prompt_tokens,
        source_equivalent_tokens, compression_ratio, mode, datetime.now(timezone.utc).isoformat()));
        conn.commit(); conn.close()
    - name: TelemetryStore.get_patterns
      params:
      - 'repo_category: str | None'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row;\
        \ if repo_category:\n    rows = conn.execute('SELECT subsystem, AVG(pass_rate)\
        \ as avg_pass_rate, AVG(iteration) as avg_iterations, AVG(constant_count)\
        \ as avg_constants, AVG(signature_count) as avg_signatures, AVG(contract_count)\
        \ as avg_contracts, COUNT(*) as attempts FROM regen_outcomes WHERE repo LIKE\
        \ ? GROUP BY subsystem ORDER BY avg_pass_rate DESC', (f'%{repo_category}%',)).fetchall()\n\
        else:\n    rows = conn.execute('SELECT subsystem, AVG(pass_rate) as avg_pass_rate,\
        \ AVG(iteration) as avg_iterations, AVG(constant_count) as avg_constants,\
        \ AVG(signature_count) as avg_signatures, AVG(contract_count) as avg_contracts,\
        \ COUNT(*) as attempts FROM regen_outcomes GROUP BY subsystem ORDER BY avg_pass_rate\
        \ DESC').fetchall(); conn.close(); return [dict(row) for row in rows]"
    - name: TelemetryStore.query_regen_outcomes
      params:
      - 'repo: str | None'
      - 'limit: int'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row;\
        \ if repo:\n    rows = conn.execute('SELECT * FROM regen_outcomes WHERE repo\
        \ = ? ORDER BY timestamp DESC LIMIT ?', (repo, limit)).fetchall()\nelse:\n\
