      params:
      - 'tool: str'
      returns: dict[str, float]
      body_hint: 'conn = sqlite3.connect(self.db_path); row = conn.execute(''SELECT
        AVG(context_tokens), AVG(output_quality), AVG(iterations) FROM invocations
        WHERE tool = ?'', (tool,)).fetchone(); conn.close(); return {''avg_context_tokens'':
        row[0] or 0, ''avg_output_quality'': row[1] or 0, ''avg_iterations'': row[2]
        or 0}'
    - name: TelemetryStore.log_regen_outcome
