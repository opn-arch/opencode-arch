        len(model.entities.interfaces), ''constraints'': len(model.entities.constraints), ''layers'': len(model.entities.layers),
        ''components'': len(model.entities.components)}, ''schema_version'': model.meta.schema_version, ''manifest_hash'':
        model.meta.manifest_hash}'
