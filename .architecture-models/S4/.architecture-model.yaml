    - name: get_artifact_context
      params:
      - 'project_root: str | Path'
      - 'artifact_name: str'
      - 'max_tokens: int'
      returns: str
      body_hint: model = get_model(project_root); return format_artifact_context(model, artifact_name, max_tokens=max_tokens)
    - name: get_source_block_context
      params:
      - 'project_root: str | Path'
      - 'source_block: str'
      - 'max_tokens: int'
      returns: str
      body_hint: model = get_model(project_root); return format_source_block_context(model, source_block, max_tokens=max_tokens,
