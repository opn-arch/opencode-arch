    - name: query_model
      params:
      - 'model: ArchitectureModel'
      - 'question: str'
      returns: str
      body_hint: "q = question.lower().strip(); if 'realizes' in q:\n    import re\n    m = re.search('(f\\\\d+|cap-\\\\w+)',\
        \ q, re.IGNORECASE)\n    if m:\n        target = m.group(1).upper()\n        realizers = [r.from_id for r in model.relationships\
        \ if r.type.value == 'realizes' and target in r.to_id.upper()]\n        if realizers:\n            lines = [f'Entities\
        \ realizing {target}:']\n            for rid in realizers:\n                beh = next((b for b in model.entities.behaviors\
        \ if b.id == rid), None)\n                if beh:\n                    lines.append(f'  - {beh.id}: {beh.name} [{beh.status.value}]')\n\
        \                else:\n                    lines.append(f'  - {rid}')\n            return '\\n'.join(lines)\n   \
        \     return f'No entities realize {target}'; if 'depend' in q:\n    import re\n    m = re.search('(uc-\\\\d+|[a-z][\\\
        \\w-]+)', q, re.IGNORECASE)\n    if m:\n        source = m.group(1)\n        deps = [r.to_id for r in model.relationships\
        \ if r.from_id.lower() == source.lower() and r.type.value == 'depends-on']\n        if deps:\n            return f\"\
        {source} depends on: {', '.join(deps)}\"\n        return f'{source} has no recorded dependencies'; if 'how many' in\
        \ q or 'count' in q:\n    return f'Model contains: {model.entity_count} entities, {model.relationship_count} relationships\\\
        n  Actors: {len(model.entities.actors)}\\n  Capabilities: {len(model.entities.capabilities)}\\n  Behaviors: {len(model.entities.behaviors)}\\\
        n  Interfaces: {len(model.entities.interfaces)}\\n  Constraints: {len(model.entities.constraints)}\\n  Layers: {len(model.entities.layers)}\\\
        n  Components: {len(model.entities.components)}'; return f\"Unable to answer: {question}\\nTry: 'what realizes F3?',\
        \ 'what does UC-14 depend on?', 'how many entities?'\""
    - name: impact_analysis
      params:
      - 'model: ArchitectureModel'
      - 'entity_id: str'
      - 'depth: int'
      returns: str
      body_hint: 'affected: dict[str, int] = {}; frontier = {entity_id}; current_depth = 0; while frontier and current_depth
