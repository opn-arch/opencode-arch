      returns: dict[str, Any]
      body_hint: 'result: dict[str, Any] = {}; try/except: ...; try/except: ...; suggestions = []; session = result.get(''session'',
        {}); if isinstance(session, dict) and session.get(''total_calls'', 0) > 0: ...; result[''suggestions''] = suggestions;
        return result'
