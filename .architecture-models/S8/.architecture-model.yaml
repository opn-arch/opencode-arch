        = []; extraction_mode = ''none''; if requirements_doc: ...; matches = []; if requirements and model_yaml: ...; result
        = {''extraction_mode'': extraction_mode, ''requirements_count''...; out_dir = path / ''.architecture-models''; out_dir.mkdir(parents=True,
        exist_ok=True); (out_dir / ''requirements-trace.json'').write_text(json.dumps(result, indent=2)); return result'
    - name: validate_architecture
      params:
      - 'model_yaml: str'
      returns: dict[str, Any]
      body_hint: "try:\n    raw = yaml.safe_load(model_yaml)\n    if raw is None:\n        return {'score': 0, 'issues': ['Empty\
        \ YAML document'], 'entity_count': 0, 'relationship_count': 0, 'is_valid': False}\n    from architecture_model.core.parser\
        \ import _parse_raw\n    from architecture_model.core.validator import validate_model\n    model = _parse_raw(raw)\n\
        \    validation_result = validate_model(model)\n    try:\n        from opencode_arch.telemetry.collector import drain_and_store\n\
        \        drain_and_store(tool='architect_validate', repo='')\n    except Exception:\n        pass\n    return {'score':\
        \ validation_result.score, 'issues': [str(issue) for issue in validation_result.issues], 'entity_count': model.entity_count,\
        \ 'relationship_count': model.relationship_count, 'is_valid': validation_result.is_valid}\nexcept Exception as e:\n\
        \    return {'score': 0, 'issues': [f'Parse/validation error: {e}'], 'entity_count': 0, 'relationship_count': 0, 'is_valid':\
        \ False}"
