      body_hint: "path = Path(repo_path); if not path.exists():\n    return {'error': f'Repository path does not exist: {repo_path}'};\
        \ try:\n    from architecture_model.manifest.generator import generate_manifest\n    manifest = generate_manifest(path)\n\
        \    suggested = None\n    try:\n        from architecture_model.manifest.grouping import group_modules\n        groups\
        \ = group_modules(manifest.modules, manifest.interfaces)\n        suggested = [{'name': g.name, 'files': g.modules,\
        \ 'file_count': len(g.modules)} for g in groups]\n    except Exception:\n        pass\n    try:\n        from opencode_arch.telemetry.collector\
        \ import drain_and_store\n        drain_and_store(tool='architect_scan', repo=path.name)\n    except Exception:\n\
        \        pass\n    result = manifest.to_dict()\n    if suggested:\n        result['suggested_components'] = suggested\n\
        \    return result\nexcept Exception as e:\n    return {'error': f'Scan failed: {e}'}"
    - name: compute_adaptive_budget
      params:
      - 'module_count: int'
      - 'base: int'
      returns: int
      body_hint: "if module_count <= 20:\n    return base; extra = (module_count - 20) // 10 * 200; return min(base + extra,\
        \ 16000)"
    - name: slice_context
      params:
      - 'repo_path: str'
      - 'focus: str'
      - 'budget: int'
      - 'detail: str'
      returns: str
      body_hint: "path = Path(repo_path); if not path.exists():\n    return f'Error: Repository path does not exist: {repo_path}';\
        \ try:\n    model_file = path / '.architecture-model.yaml'\n    if budget <= 0:\n        if model_file.exists():\n\
        \            from architecture_model.core.parser import load_model\n            model = load_model(model_file)\n \
        \           file_count = sum((len(getattr(c, 'files', [])) for c in model.entities.components))\n            budget\
        \ = compute_adaptive_budget(file_count)\n        else:\n            from architecture_model.manifest.generator import\
        \ generate_manifest\n            manifest = generate_manifest(path)\n            budget = compute_adaptive_budget(len(manifest.modules))\n\
        \        source_size = _estimate_source_size(path)\n        min_budget_for_50x = source_size // (50 * 4)\n       \
        \ if min_budget_for_50x > budget:\n            budget = min(min_budget_for_50x, 16000)\n    if model_file.exists():\n\
        \        result = _slice_from_model(path, focus, budget, detail)\n    else:\n        result = _slice_from_manifest(path,\
        \ focus, budget)\n    source_size = _estimate_source_size(path)\n    char_budget = budget * 4\n    if source_size\
        \ > 0 and char_budget > 0:\n        ratio = source_size / char_budget\n        if ratio > COMPRESSION_CRITICAL_THRESHOLD:\n\
        \            warning = f\"# COMPRESSION WARNING: {ratio:.0f}x compression detected!\\n# Source: {source_size // 1024}KB\
        \ compressed into {char_budget // 1024}KB context.\\n# At >200x compression, regeneration pass rate drops to ~19%.\\\
        n# RECOMMENDATION: Use focused slicing (architect_slice with focus='F1', 'F2', etc.)\\n# to slice per-block. Available\
        \ source-blocks can be found via architect_scan.\\n\\n\"\n            result = warning + result\n        elif ratio\
        \ > COMPRESSION_WARN_THRESHOLD:\n            warning = f'# NOTE: {ratio:.0f}x compression ratio (>50x reduces pass\
        \ rate).\\n# Consider per-block slicing for better regeneration outcomes.\\n\\n'\n            result = warning + result\n\
        \    try:\n        from opencode_arch.telemetry.collector import drain_and_store\n        drain_and_store(tool='architect_slice',\
        \ repo=path.name)\n    except Exception:\n        pass\n    return result\nexcept Exception as e:\n    return f'Error\
        \ during context slicing: {e}'"
    - name: get_stats
      params:
      - 'repo_path: str'
