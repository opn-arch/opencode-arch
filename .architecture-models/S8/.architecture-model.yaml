    - name: ingest_source_graph
      params:
      - 'repo_path: str'
      - 'source_graph_json: str'
      returns: dict
      decorators:
      - with_quality
      body_hint: "try:\n    from architecture_model.manifest.protocol import SourceGraph\n    from architecture_model.manifest.grouping\
        \ import group_source_graph, auto_source_blocks\n    from architecture_model.core.types import ArchitectureModel,\
        \ Component, Entities, ModelMeta\n    from architecture_model.orchestration.auto_enrich import extract_component_interfaces\n\
        \    from architecture_model.core.parser import save_model\n    project_root = Path(repo_path)\n    data = json.loads(source_graph_json)\n\
        \    graph = SourceGraph.from_json(data)\n    graph.root = repo_path\n    groups = group_source_graph(graph)\n   \
        \ if not groups:\n        return {'error': 'No non-trivial source units found', 'units': len(graph.units)}\n    components:\
        \ list[Component] = []\n    for idx, group in enumerate(groups, 1):\n        components.append(Component(id=f'COMP-{idx}',\
        \ name=group.name, status='ACTIVE', files=group.modules))\n    from architecture_model.core.types import Relationship,\
        \ RelationType\n    file_to_comp: dict[str, str] = {}\n    for comp in components:\n        for f in comp.files or\
        \ []:\n            file_to_comp[f] = comp.id\n    relationships: list[Relationship] = []\n    seen_rels: set[tuple[str,\
        \ str]] = set()\n    for edge in graph.edges:\n        source_comp = file_to_comp.get(edge.source)\n        target_comp\
        \ = file_to_comp.get(edge.target)\n        if source_comp and target_comp and (source_comp != target_comp):\n    \
        \        pair = (source_comp, target_comp)\n            if pair not in seen_rels:\n                seen_rels.add(pair)\n\
        \                relationships.append(Relationship(type=RelationType.DEPENDS_ON, from_id=source_comp, to_id=target_comp,\
        \ description=f'{edge.source} -> {edge.target}'))\n    model = ArchitectureModel(meta=ModelMeta(project=project_root.name,\
        \ schema_version='1.3'), entities=Entities(components=components), relationships=relationships)\n    n_ifaces = extract_component_interfaces(model,\
        \ graph)\n    from architecture_model.orchestration.auto_enrich import enrich_from_source_graph\n    enrich_from_source_graph(model,\
        \ graph)\n    source_block_config = auto_source_blocks(groups, threshold=3)\n    model_path = project_root / '.architecture-model-extracted.yaml'\n\
        \    save_model(model, model_path)\n    graph_path = project_root / '.architecture-models' / 'source-graph.json'\n\
        \    graph_path.parent.mkdir(parents=True, exist_ok=True)\n    graph_path.write_text(json.dumps(graph.to_json(), indent=2))\n\
        \    return {'stored': True, 'model_path': str(model_path), 'graph_path': str(graph_path), 'components': len(components),\
        \ 'interfaces': n_ifaces, 'source_blocks': len(source_block_config), 'units': len(graph.units), 'edges': len(graph.edges),\
        \ 'language': graph.language, 'groups': [{'name': g.name, 'files': g.modules, 'file_count': len(g.modules)} for g\
        \ in groups]}\nexcept json.JSONDecodeError as e:\n    return {'error': f'Invalid JSON: {e}'}\nexcept Exception as\
        \ e:\n    return {'error': str(e)}"
