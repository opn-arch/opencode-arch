    - name: TelemetryStore.__init__
      params:
      - 'db_path: Path | None'
      body_hint: "if db_path is None:\n    db_path = Path.home() / '.opencode-arch' / 'telemetry.db'; self.db_path = db_path;\
        \ self.db_path.parent.mkdir(parents=True, exist_ok=True); self._init_db()"
    - name: TelemetryStore.record
      params:
      - 'tool: str'
      - 'repo: str'
      - 'context_tokens: int'
      - 'output_quality: int'
      - 'iterations: int'
      - 'metadata: str'
      body_hint: conn = sqlite3.connect(self.db_path); conn.execute('INSERT INTO invocations (timestamp, tool, repo, context_tokens,
        output_quality, iterations, metadata) VALUES (?, ?, ?, ?, ?, ?, ?)', (time.time(), tool, repo, context_tokens, output_quality,
        iterations, metadata)); conn.commit(); conn.close()
    - name: TelemetryStore.query
      params:
      - 'tool: str | None'
      - 'limit: int'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; if tool:\n    rows = conn.execute('SELECT\
        \ * FROM invocations WHERE tool = ? ORDER BY timestamp DESC LIMIT ?', (tool, limit)).fetchall()\nelse:\n    rows =\
        \ conn.execute('SELECT * FROM invocations ORDER BY timestamp DESC LIMIT ?', (limit,)).fetchall(); conn.close(); return\
        \ [dict(row) for row in rows]"
    - name: TelemetryStore.averages
      params:
      - 'tool: str'
      returns: dict[str, float]
      body_hint: 'conn = sqlite3.connect(self.db_path); row = conn.execute(''SELECT AVG(context_tokens), AVG(output_quality),
        AVG(iterations) FROM invocations WHERE tool = ?'', (tool,)).fetchone(); conn.close(); return {''avg_context_tokens'':
        row[0] or 0, ''avg_output_quality'': row[1] or 0, ''avg_iterations'': row[2] or 0}'
    - name: TelemetryStore.log_regen_outcome
      params:
      - 'repo: str'
      - 'subsystem: str'
      - 'iteration: int'
      - 'features: dict[str, int]'
      - 'pass_rate: float'
      - 'time_seconds: float'
      - 'prompt_tokens: int'
      - 'source_equivalent_tokens: int'
      - 'compression_ratio: float'
      - 'mode: str'
      body_hint: conn = sqlite3.connect(self.db_path); conn.execute('INSERT INTO regen_outcomes (repo, subsystem, iteration,
        constant_count, signature_count, contract_count, pass_rate, time_seconds, prompt_tokens, source_equivalent_tokens,
        compression_ratio, mode, timestamp) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)', (repo, subsystem, iteration,
        features.get('constant_count', 0), features.get('signature_count', 0), features.get('contract_count', 0), pass_rate,
        time_seconds, prompt_tokens, source_equivalent_tokens, compression_ratio, mode, datetime.now(timezone.utc).isoformat()));
        conn.commit(); conn.close()
    - name: TelemetryStore.get_patterns
      params:
      - 'repo_category: str | None'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; if repo_category:\n    rows = conn.execute('SELECT\
        \ subsystem, AVG(pass_rate) as avg_pass_rate, AVG(iteration) as avg_iterations, AVG(constant_count) as avg_constants,\
        \ AVG(signature_count) as avg_signatures, AVG(contract_count) as avg_contracts, COUNT(*) as attempts FROM regen_outcomes\
        \ WHERE repo LIKE ? GROUP BY subsystem ORDER BY avg_pass_rate DESC', (f'%{repo_category}%',)).fetchall()\nelse:\n\
        \    rows = conn.execute('SELECT subsystem, AVG(pass_rate) as avg_pass_rate, AVG(iteration) as avg_iterations, AVG(constant_count)\
        \ as avg_constants, AVG(signature_count) as avg_signatures, AVG(contract_count) as avg_contracts, COUNT(*) as attempts\
        \ FROM regen_outcomes GROUP BY subsystem ORDER BY avg_pass_rate DESC').fetchall(); conn.close(); return [dict(row)\
        \ for row in rows]"
    - name: TelemetryStore.query_regen_outcomes
      params:
      - 'repo: str | None'
      - 'limit: int'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; if repo:\n    rows = conn.execute('SELECT\
        \ * FROM regen_outcomes WHERE repo = ? ORDER BY timestamp DESC LIMIT ?', (repo, limit)).fetchall()\nelse:\n    rows\
        \ = conn.execute('SELECT * FROM regen_outcomes ORDER BY timestamp DESC LIMIT ?', (limit,)).fetchall(); conn.close();\
        \ return [dict(row) for row in rows]"
    - name: TelemetryStore.record_learning_curve
      params:
      - 'repo: str'
      - 'mode: str'
      - 'total_subsystems: int'
      - 'converged_subsystems: int'
      - 'avg_pass_rate: float'
      - 'avg_iterations: float'
      - 'avg_prompt_tokens: float'
      - 'avg_source_equivalent: float'
      - 'avg_compression_ratio: float'
      - 'total_time_seconds: float'
      body_hint: conn = sqlite3.connect(self.db_path); row = conn.execute('SELECT COALESCE(MAX(repo_sequence), 0) FROM...;
        seq = (row[0] or 0) + 1; conn.execute('INSERT INTO learning_curve (repo, repo_sequence, mode, total_subsystems, converged_subsystems,
        avg_pass_rate, avg_iterations, avg_prompt_tokens, avg_source_equivalent, avg_compression_ratio, total_time_seconds,
        timestamp) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)', (repo, seq, mode, total_subsystems, converged_subsystems,
        avg_pass_rate, avg_iterations, avg_prompt_tokens, avg_source_equivalent, avg_compression_ratio, total_time_seconds,
        datetime.now(timezone.utc).isoformat())); conn.commit(); conn.close()
    - name: TelemetryStore.get_learning_curve
      params:
      - 'mode: str | None'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; if mode:\n    rows = conn.execute('SELECT\
        \ * FROM learning_curve WHERE mode = ? ORDER BY repo_sequence ASC', (mode,)).fetchall()\nelse:\n    rows = conn.execute('SELECT\
        \ * FROM learning_curve ORDER BY repo_sequence ASC').fetchall(); conn.close(); return [dict(row) for row in rows]"
    - name: TelemetryStore.record_report_card
      params:
      - 'repo: str'
      - 'mode: str'
      - 'grade: str'
      - 'fidelity: float'
      - 'compression_ratio: float'
      - 'failure_patterns: str'
      - 'novel_patterns: int'
      - 'improvement_actions: str'
      body_hint: conn = sqlite3.connect(self.db_path); conn.execute('INSERT INTO report_cards (repo, mode, grade, fidelity,
