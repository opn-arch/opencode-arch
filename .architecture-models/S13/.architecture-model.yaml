        ?, ?)', (repo, mode, grade, fidelity, compression_ratio, failure_patterns, novel_patterns, improvement_actions, datetime.now(timezone.utc).isoformat()));
        conn.commit(); conn.close()
    - name: TelemetryStore.get_report_cards
      params:
      - 'repo: str | None'
      - 'limit: int'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; if repo:\n    rows = conn.execute('SELECT\
        \ * FROM report_cards WHERE repo = ? ORDER BY timestamp DESC LIMIT ?', (repo, limit)).fetchall()\nelse:\n    rows\
        \ = conn.execute('SELECT * FROM report_cards ORDER BY timestamp DESC LIMIT ?', (limit,)).fetchall(); conn.close();\
        \ return [dict(row) for row in rows]"
    - name: TelemetryStore.record_lesson
      params:
      - 'lesson_id: str'
      - 'discovered_repo: str'
      - 'category: str'
      - 'description: str'
      - 'evidence: str'
      body_hint: "conn = sqlite3.connect(self.db_path); try:\n    conn.execute('INSERT OR IGNORE INTO lessons (lesson_id,\
        \ discovered_repo, category, description, evidence, timestamp) VALUES (?, ?, ?, ?, ?, ?)', (lesson_id, discovered_repo,\
        \ category, description, evidence, datetime.now(timezone.utc).isoformat()))\n    conn.commit()\nfinally:\n    conn.close()"
    - name: TelemetryStore.get_lessons
      params:
      - 'category: str | None'
      returns: list[dict[str, Any]]
      body_hint: "conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; if category:\n    rows = conn.execute('SELECT\
        \ * FROM lessons WHERE category = ? ORDER BY timestamp DESC', (category,)).fetchall()\nelse:\n    rows = conn.execute('SELECT\
        \ * FROM lessons ORDER BY timestamp DESC').fetchall(); conn.close(); return [dict(row) for row in rows]"
    - name: TelemetryStore.mark_lesson_applied
      params:
      - 'lesson_id: str'
      - 'repo: str'
      body_hint: "conn = sqlite3.connect(self.db_path); row = conn.execute('SELECT applied_to FROM lessons WHERE lesson_id\
        \ = ?', (lesson_id,)).fetchone(); if row:\n    import json\n    current = json.loads(row[0] or '[]')\n    if repo\
        \ not in current:\n        current.append(repo)\n        conn.execute('UPDATE lessons SET applied_to = ? WHERE lesson_id\
        \ = ?', (json.dumps(current), lesson_id))\n        conn.commit(); conn.close()"
    - name: TelemetryStore.record_drift_flag
      params:
      - 'file: str'
      - 'issue: str'
      - 'severity: str'
      - 'auto_fixable: bool'
      - 'suggested_fix: str'
      body_hint: conn = sqlite3.connect(self.db_path); conn.execute('INSERT INTO drift_flags (file, issue, severity, auto_fixable,
        suggested_fix, resolved, timestamp) VALUES (?, ?, ?, ?, ?, 0, ?)', (file, issue, severity, int(auto_fixable), suggested_fix,
        datetime.now(timezone.utc).isoformat())); conn.commit(); conn.close()
    - name: TelemetryStore.get_drift_flags
      params:
      - 'resolved: bool'
      returns: list[dict[str, Any]]
      body_hint: conn = sqlite3.connect(self.db_path); conn.row_factory = sqlite3.Row; rows = conn.execute('SELECT * FROM
        drift_flags WHERE resolved = ? ORDER BY timestamp DESC', (int(resolved),)).fetchall(); conn.close(); return [dict(row)
        for row in rows]
    - name: TelemetryStore.resolve_drift_flag
      params:
      - 'flag_id: int'
      body_hint: conn = sqlite3.connect(self.db_path); conn.execute('UPDATE drift_flags SET resolved = 1 WHERE id = ?', (flag_id,));
        conn.commit(); conn.close()
    - name: TelemetryStore.record_function_metric
      params:
      - 'tool: str'
