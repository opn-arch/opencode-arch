      - 'output_metrics: str'
      returns: None
      body_hint: conn = sqlite3.connect(self.db_path); conn.execute('INSERT INTO function_metrics\n               (timestamp,
        tool, function, module, repo, time_ms, quality_scores, input_metrics, output_metrics)\n               VALUES (?, ?,
        ?, ?, ?, ?, ?, ?, ?)', (time.time(), tool, function, module, repo, time_ms, quality_scores, input_metrics, output_metrics));
        conn.commit(); conn.close()
    - name: TelemetryStore.get_function_metrics
      params:
      - 'repo: str'
      - 'function: str'
      - 'tool: str'
      - 'last: int'
      returns: list[dict]
      body_hint: 'conn = sqlite3.connect(self.db_path); query = ''SELECT * FROM function_metrics WHERE 1=1''; params: list
        = []; if repo: ...; if function: ...; if tool: ...; query += '' ORDER BY timestamp DESC''; if last: ...; cursor =
        conn.execute(query, params); columns = [desc[0] for desc in cursor.description]; rows = [dict(zip(columns, row)) for
        row in cursor.fetchall()]; conn.close(); return rows'
