    kind: library
    constants:
    - name: AUDIT_STAGE1_VERSION
      value: v1
    - name: AUDIT_STAGE1_TEMPLATE
      value: "You are analyzing a codebase to identify its functional subsystems.\n\n## Source Code Structure\n{source_summary}\n\
        \n## Project Context\n{context_md}\n\nBased ONLY on the code structure, imports, and documentation above, identify\
        \ the distinct functional subsystems (groups of files that work together to accomplish a specific purpose).\n\nFor\
        \ each subsystem, provide:\n1. A short descriptive name\n2. Which files belong to it\n3. A one-sentence rationale\
        \ explaining why these files form a coherent unit\n\nReturn your analysis as JSON:\n```json\n{{\n  \"blocks\": [\n\
        \    {{\"id\": \"LLM-A\", \"name\": \"...\", \"files\": [\"...\"], \"rationale\": \"...\"}}\n  ]\n}}\n```\n"
    - name: AUDIT_STAGE2_VERSION
      value: v1
    - name: AUDIT_STAGE2_TEMPLATE
      value: "You previously identified these functional subsystems:\n\n{llm_decomposition}\n\nThe automated tool produced\
        \ this decomposition with these quality metrics:\n\n{tool_decomposition}\n\nModularity (Newman's Q): {modularity}\n\
        Per-block conductance: {conductance}\n\nCompare your grouping with the tool's. For each pair:\n- If they substantially\
        \ agree (>70% file overlap), mark as \"agree\"\n- If they disagree, explain WHY with specific evidence (naming conventions,\
        \ documented boundaries, import patterns)\n\nReturn as JSON:\n```json\n{{\n  \"agreement_rate\": 0.71,\n  \"matched_pairs\"\
        : [\n    {{\"tool_source_block\": \"S1\", \"llm_block\": \"LLM-A\", \"overlap\": 0.9, \"verdict\": \"agree\"}}\n \
        \ ],\n  \"disagreements\": [\n    {{\n      \"tool_source_block\": \"S3\",\n      \"llm_block\": \"LLM-C\",\n    \
        \  \"overlap\": 0.4,\n      \"llm_rationale\": \"...\",\n      \"cites_doc\": \"README.md#L42\",\n      \"recommendation\"\
        : \"flag_for_review\"\n    }}\n  ]\n}}\n```\n"
    - name: MATCHING_TEMPLATE
      value: 'Match the following functions to the requirements they satisfy.

        For each match, provide the function ID, requirement ID, a confidence score (0.0-1.0),

        and evidence explaining the match.


        Requirements:

        {requirements_text}


        Functions (from architecture model):

        {functions_text}


        Return a JSON object with a "matches" key containing an array of objects,

        each with "function_id", "requirement_id", "confidence", and "evidence" fields.


        Return ONLY valid JSON. Example:

        {{"matches": [{{"function_id": "COMP-1", "requirement_id": "REQ-001", "confidence": 0.85, "evidence": "Component handles
        user authentication"}}]}}

        '
    - name: MATCHING_VERSION
      value: req-match-v1
    - name: REQUIREMENTS_EXTRACT_TEMPLATE
      value: 'Analyze the following document and identify all distinct requirements.

        Return a JSON object with a "requirements" key containing an array of objects,

        each with "id", "text", and "anchor" fields.


        - "id": Use any existing REQ-NNN ID found in the text, or assign one as REQ-001, REQ-002, etc.

        - "text": The requirement statement (concise, imperative).

        - "anchor": The line reference or section where it appears (e.g., "L5", "Section 2").


        Document content:

        ---

        {doc_content}

        ---


        Return ONLY valid JSON. Example:

        {{"requirements": [{{"id": "REQ-001", "text": "System shall support login", "anchor": "L3"}}]}}

        '
    - name: REQUIREMENTS_EXTRACT_VERSION
      value: req-extract-v1
    - name: REQUIREMENTS_RETROACTIVE_TEMPLATE
      value: 'Given the following architecture model, derive requirements that the system must satisfy.

        Look at capabilities, behaviors, interfaces, and component responsibilities.

        Return a JSON object with a "requirements" key containing an array of objects,

        each with "id", "text", and "source" fields.


        - "id": Assign as REQ-001, REQ-002, etc.

        - "text": The derived requirement (concise, imperative, testable).

        - "source": Which model element (capability/behavior/interface) this derives from.


        Architecture model:

        ---

        {model_yaml}

        ---


        Return ONLY valid JSON. Example:

        {{"requirements": [{{"id": "REQ-001", "text": "System shall validate input", "source": "CAP-F1"}}]}}

        '
    - name: REQUIREMENTS_RETROACTIVE_VERSION
      value: req-retro-v1
    signatures:
    - name: LLMCache.__init__
      params:
      - 'cache_dir: Path | None'
      body_hint: self.cache_dir = cache_dir or Path.home() / '.opencode-arch' / 'llm-cache'
    - name: LLMCache.get
      params:
      - 'content_hash: str'
      - 'prompt_hash: str'
      returns: CachedResult | None
      body_hint: "path = self._path(content_hash, prompt_hash); if not path.exists():\n    return None; data = json.loads(path.read_text());\
        \ return CachedResult(**data, cached=True)"
    - name: LLMCache.put
      params:
      - 'content_hash: str'
      - 'prompt_hash: str'
      - 'output: str'
      - 'model: str'
      returns: None
      body_hint: 'path = self._path(content_hash, prompt_hash); path.parent.mkdir(parents=True, exist_ok=True); data = {''output'':
        output, ''model'': model, ''prompt_hash'': prompt_hash, ''content_hash'': content_hash, ''timestamp'': time.strftime(''%Y-%m-%dT%H:%M:%SZ'',
        time.gmtime())}; path.write_text(json.dumps(data))'
    - name: LLMCache.clear
      returns: int
      body_hint: "count = 0; if self.cache_dir.exists():\n    for f in self.cache_dir.rglob('*.json'):\n        f.unlink()\n\
        \        count += 1; return count"
    - name: hash_content
      params:
      - 'content: str'
      returns: str
      body_hint: return hashlib.sha256(content.encode()).hexdigest()
    - name: cached_llm_call
      params:
      - runner
      - 'prompt: str'
      - 'content_hash: str'
      - 'prompt_template_hash: str'
      - 'repo_path: str'
      - 'cache: LLMCache | None'
      returns: CachedResult
      body_hint: "if cache is not None:\n    hit = cache.get(content_hash, prompt_template_hash)\n    if hit is not None:\n\
        \        return hit; result = await runner.run(prompt, repo_path); cached_result = CachedResult(output=result.output,\
        \ model='unknown', prompt_hash=prompt_template_hash, content_hash=content_hash, cached=False, timestamp=time.strftime('%Y-%m-%dT%H:%M:%SZ',\
        \ time.gmtime())); if cache is not None:\n    cache.put(content_hash, prompt_template_hash, result.output, 'unknown');\
        \ return cached_result"
